<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent-Driven Execution POC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .panel h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .tool-item, .connection-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .tool-name, .connection-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .tool-description, .connection-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .tool-params {
            background: #e9ecef;
            border-radius: 5px;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            color: #495057;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-connected {
            background-color: #28a745;
        }
        
        .status-disconnected {
            background-color: #dc3545;
        }
        
        .task-form {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group select, .form-group textarea, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5a67d8;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .tasks-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .task-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .task-status {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 5px;
        }
        
        .status-pending {
            background: #ffc107;
            color: #856404;
        }
        
        .status-running {
            background: #17a2b8;
            color: white;
        }
        
        .status-completed {
            background: #28a745;
            color: white;
        }
        
        .status-failed {
            background: #dc3545;
            color: white;
        }
        
        .log-container {
            background: #1e1e1e;
            color: #00ff00;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        
        .log-timestamp {
            color: #888;
        }
        
        .connection-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .connection-btn.disconnect {
            background: #dc3545;
        }
        
        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Agent-Driven Execution POC</h1>
            <p>Real-time agent execution system with 100+ tools and connections framework</p>
        </div>
        
        <div class="dashboard">
            <div class="panel">
                <h2>🛠️ Available Tools</h2>
                <div id="tools-list"></div>
            </div>
            
            <div class="panel">
                <h2>🔗 Active Connections</h2>
                <div id="connections-list"></div>
            </div>
            
            <div class="panel">
                <h2>🔌 Connector Management</h2>
                <div style="margin-bottom: 15px;">
                    <button class="btn btn-secondary" onclick="loadAvailableConnectors()">Refresh Connectors</button>
                    <button class="btn" onclick="showConnectorConfig()" style="margin-left: 10px;">Add Connector</button>
                </div>
                <div id="available-connectors-list"></div>
            </div>
        </div>
        
        <div class="dashboard">
            <div class="panel">
                <h2>📋 Create Task</h2>
                <div class="task-form">
                    <div class="form-group">
                        <label for="tool-select">Select Tool:</label>
                        <select id="tool-select">
                            <option value="">Choose a tool...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-description">Task Description:</label>
                        <input type="text" id="task-description" placeholder="Brief description of task">
                    </div>
                    <div class="form-group">
                        <label for="task-parameters">Parameters (JSON):</label>
                        <textarea id="task-parameters" placeholder='{"param1": "value1", "param2": "value2"}'></textarea>
                    </div>
                    <button class="btn" onclick="executeTask()">Execute Task</button>
                </div>
            </div>
            
            <div class="panel">
                <h2>📊 Active Tasks</h2>
                <div class="tasks-list" id="tasks-list"></div>
                <button class="btn btn-secondary" onclick="refreshTasks()" style="margin-top: 10px;">Refresh Tasks</button>
            </div>
        </div>
        
        <div class="dashboard">
            <div class="panel">
                <h2>📊 Active Tasks</h2>
                <div class="tasks-list" id="tasks-list"></div>
                <button class="btn btn-secondary" onclick="refreshTasks()" style="margin-top: 10px;">Refresh Tasks</button>
            </div>
            
            <div class="panel">
                <h2>📝 Real-time Logs</h2>
                <div class="log-container" id="log-container"></div>
                <button class="btn btn-secondary" onclick="clearLogs()" style="margin-top: 10px;">Clear Logs</button>
            </div>
        </div>
        
        </div>

    <script>
        // Initialize Socket.IO
        const socket = io();
        
        // Global variables
        let tools = {};
        let connections = {};
        let tasks = [];
        
        // Socket.IO event handlers
        socket.on('connect', function(data) {
            addLog('Connected to server');
            loadTools();
            loadConnections();
            refreshTasks();
        });
        
        socket.on('task_update', function(data) {
            addLog(`Task ${data.task_id}: ${data.status} - ${data.message}`);
            refreshTasks();
        });
        
        socket.on('tool_progress', function(data) {
            addLog(`Tool ${data.tool}: ${data.message}`);
        });
        
        socket.on('tool_result', function(data) {
            addLog(`Tool ${data.tool} completed: ${JSON.stringify(data.result)}`);
        });
        
        socket.on('tool_error', function(data) {
            addLog(`Tool ${data.tool} error: ${data.error}`, 'error');
        });
        
        socket.on('connection_status', function(data) {
            addLog(`Connection ${data.connection}: ${data.status}`);
            loadConnections();
        });
        
        socket.on('connection_error', function(data) {
            addLog(`Connection error: ${data.error}`, 'error');
        });
        
        // Update connect handler to include connectors
        socket.on('connect', function(data) {
            addLog('Connected to server');
            loadTools();
            loadConnections();
            loadAvailableConnectors();
            refreshTasks();
        });
        
        socket.on('tool_result', function(data) {
            addLog(`Tool ${data.tool} completed: ${JSON.stringify(data.result)}`);
        });
        
        socket.on('tool_error', function(data) {
            addLog(`Tool ${data.tool} error: ${data.error}`, 'error');
        });
        
        socket.on('connection_status', function(data) {
            addLog(`Connection ${data.connection}: ${data.status}`);
            loadConnections();
        });
        
        socket.on('connection_error', function(data) {
            addLog(`Connection error: ${data.error}`, 'error');
        });
        
        // API functions
        async function loadTools() {
            try {
                const response = await fetch('/api/tools');
                tools = await response.json();
                displayTools();
                populateToolSelect();
            } catch (error) {
                addLog(`Error loading tools: ${error.message}`, 'error');
            }
        }
        
        async function loadConnections() {
            try {
                const response = await fetch('/api/connections');
                connections = await response.json();
                displayConnections();
            } catch (error) {
                addLog(`Error loading connections: ${error.message}`, 'error');
            }
        }
        
        async function loadAvailableConnectors() {
            try {
                const response = await fetch('/api/available-connectors');
                availableConnectors = await response.json();
                displayAvailableConnectors();
            } catch (error) {
                addLog(`Error loading available connectors: ${error.message}`, 'error');
            }
        }
        
        async function registerConnector(connectorName, moduleName, className) {
            try {
                // Collect config from inputs
                const config = {};
                const connector = availableConnectors.find(c => c.name === connectorName);
                if (connector && connector.config_fields) {
                    connector.config_fields.forEach(field => {
                        const value = document.getElementById(`config-${connectorName}-${field.name}`).value;
                        if (value) {
                            config[field.name] = value;
                        }
                    });
                }
                
                const response = await fetch('/api/register-connector', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        connector_name: connectorName,
                        module_name: moduleName,
                        class_name: className,
                        config: config
                    })
                });
                
                const result = await response.json();
                if (response.ok) {
                    addLog(`Connector ${connectorName} registered successfully`);
                    loadConnections();
                    loadAvailableConnectors();
                } else {
                    addLog(`Error registering connector: ${result.error}`, 'error');
                }
            } catch (error) {
                addLog(`Error registering connector: ${error.message}`, 'error');
            }
        }
        
        async function unregisterConnector(connectorName) {
            try {
                const response = await fetch('/api/unregister-connector', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        connector_name: connectorName
                    })
                });
                
                const result = await response.json();
                if (response.ok) {
                    addLog(`Connector ${connectorName} unregistered successfully`);
                    loadConnections();
                    loadAvailableConnectors();
                } else {
                    addLog(`Error unregistering connector: ${result.error}`, 'error');
                }
            } catch (error) {
                addLog(`Error unregistering connector: ${error.message}`, 'error');
            }
        }
        
        async function showConnectorConfig() {
            try {
                const response = await fetch('/api/available-connectors');
                const connectors = await response.json();
                
                if (connectors.length === 0) {
                    addLog('No connectors available', 'error');
                    return;
                }
                
                // Create modal for connector selection
                const modal = document.createElement('div');
                modal.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
                    z-index: 1000;
                `;
                
                const modalContent = document.createElement('div');
                modalContent.style.cssText = `
                    background: white; padding: 20px; border-radius: 10px; max-width: 500px; width: 90%;
                    max-height: 80vh; overflow-y: auto;
                `;
                
                modalContent.innerHTML = `
                    <h3 style="margin-top: 0; color: #333;">Available Connectors</h3>
                    <div style="margin: 20px 0;">
                        ${connectors.map(conn => `
                            <div style="border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px;">
                                <h4 style="margin: 0 0 10px 0; color: #667eea;">${conn.name}</h4>
                                <p style="margin: 0 0 10px 0; color: #666;">${conn.description}</p>
                                <p style="margin: 0 0 10px 0; font-size: 0.9em; color: #888;">Type: ${conn.type}</p>
                                ${conn.is_registered ? 
                                    `<p style="margin: 0; color: #28a745;">✅ Already registered</p>
                                    <button class="btn btn-secondary" onclick="unregisterConnector('${conn.name}')">Unregister</button>` :
                                    `<button class="btn" onclick="registerConnector('${conn.name}', '${conn.module}', '${conn.class}')">Register</button>`
                                }
                                ${conn.error ? `<p style="margin: 10px 0; color: #dc3545; font-size: 0.8em;">Error: ${conn.error}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <div style="text-align: right; margin-top: 20px;">
                        <button class="btn btn-secondary" onclick="this.closest('div[style*=fixed]').remove()">Close</button>
                    </div>
                `;
                
                modal.appendChild(modalContent);
                document.body.appendChild(modal);
                
            } catch (error) {
                addLog(`Error showing connector config: ${error.message}`, 'error');
            }
        }
        
        async function refreshTasks() {
            try {
                const response = await fetch('/api/tasks');
                tasks = await response.json();
                displayTasks();
            } catch (error) {
                addLog(`Error loading tasks: ${error.message}`, 'error');
            }
        }
        
        async function executeTask() {
            const toolSelect = document.getElementById('tool-select');
            const description = document.getElementById('task-description').value;
            const parametersText = document.getElementById('task-parameters').value;
            
            if (!toolSelect.value || !description) {
                alert('Please select a tool and provide a description');
                return;
            }
            
            let parameters = {};
            if (parametersText) {
                try {
                    parameters = JSON.parse(parametersText);
                } catch (error) {
                    alert('Invalid JSON in parameters field');
                    return;
                }
            }
            
            const task = {
                tool: toolSelect.value,
                description: description,
                parameters: parameters
            };
            
            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(task)
                });
                
                const result = await response.json();
                if (response.ok) {
                    addLog(`Task submitted: ${result.task_id}`);
                    refreshTasks();
                    // Clear form
                    document.getElementById('task-description').value = '';
                    document.getElementById('task-parameters').value = '';
                } else {
                    addLog(`Error submitting task: ${result.error}`, 'error');
                }
            } catch (error) {
                addLog(`Error submitting task: ${error.message}`, 'error');
            }
        }
        
        async function toggleConnection(connectionName, action) {
            socket.emit('connection_action', {
                connection: connectionName,
                action: action
            });
        }
        
        // Display functions
        function displayTools() {
            const toolsList = document.getElementById('tools-list');
            toolsList.innerHTML = '';
            
            for (const [name, tool] of Object.entries(tools)) {
                const toolDiv = document.createElement('div');
                toolDiv.className = 'tool-item';
                toolDiv.innerHTML = `
                    <div class="tool-name">${tool.name} ${tool.is_realtime ? '🔴' : ''}</div>
                    <div class="tool-description">${tool.description}</div>
                    <div class="tool-params">${JSON.stringify(tool.parameters, null, 2)}</div>
                `;
                toolsList.appendChild(toolDiv);
            }
        }
        
        function displayConnections() {
            const connectionsList = document.getElementById('connections-list');
            connectionsList.innerHTML = '';
            
            for (const [name, connection] of Object.entries(connections)) {
                const connDiv = document.createElement('div');
                connDiv.className = 'connection-item';
                connDiv.innerHTML = `
                    <div class="connection-name">
                        <span class="status-indicator ${connection.is_connected ? 'status-connected' : 'status-disconnected'}"></span>
                        ${connection.name} (${connection.type})
                        <button class="connection-btn ${connection.is_connected ? 'disconnect' : ''}" 
                                onclick="toggleConnection('${connection.name}', '${connection.is_connected ? 'disconnect' : 'connect'}')">
                            ${connection.is_connected ? 'Disconnect' : 'Connect'}
                        </button>
                    </div>
                    <div class="connection-description">Last activity: ${new Date(connection.last_activity).toLocaleString()}</div>
                `;
                connectionsList.appendChild(connDiv);
            }
        }
        
        function displayAvailableConnectors() {
            const connectorsList = document.getElementById('available-connectors-list');
            connectorsList.innerHTML = '';
            
            if (availableConnectors.length === 0) {
                connectorsList.innerHTML = '<p style="color: #666;">No connectors available</p>';
                return;
            }
            
            availableConnectors.forEach(connector => {
                const connDiv = document.createElement('div');
                connDiv.className = 'connection-item';
                
                let configHtml = '';
                if (connector.config_fields && connector.config_fields.length > 0) {
                    configHtml = '<div class="config-fields" style="margin-top: 10px;">';
                    connector.config_fields.forEach(field => {
                        const inputType = field.type === 'string' && field.sensitive ? 'password' : 'text';
                        configHtml += `
                            <div style="margin-bottom: 5px;">
                                <label style="display: block; font-weight: bold;">${field.name} ${field.required ? '(Required)' : '(Optional)'}</label>
                                <input type="${inputType}" id="config-${connector.name}-${field.name}" placeholder="${field.description}" style="width: 100%; padding: 5px;">
                            </div>
                        `;
                    });
                    configHtml += '</div>';
                }
                
                connDiv.innerHTML = `
                    <div class="connection-name">
                        <span class="status-indicator ${connector.is_registered ? 'status-connected' : 'status-disconnected'}"></span>
                        ${connector.name} (${connector.type})
                        ${connector.is_registered ? 
                            `<button class="connection-btn disconnect" onclick="unregisterConnector('${connector.name}')">Unregister</button>` :
                            `<button class="connection-btn" onclick="registerConnector('${connector.name}', '${connector.module}', '${connector.class}')">Register</button>`
                        }
                    </div>
                    <div class="connection-description">
                        ${connector.description}
                        ${configHtml}
                        ${connector.error ? `<br><small style="color: #dc3545;">Error: ${connector.error}</small>` : ''}
                    </div>
                `;
                connectorsList.appendChild(connDiv);
            });
        }
        
        function displayTasks() {
            const tasksList = document.getElementById('tasks-list');
            tasksList.innerHTML = '';
            
            tasks.forEach(task => {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'task-item';
                taskDiv.innerHTML = `
                    <div class="task-status status-${task.status}">${task.status}</div>
                    <div><strong>Task:</strong> ${task.task.description || 'No description'}</div>
                    <div><strong>Tool:</strong> ${task.task.tool}</div>
                    <div><strong>Started:</strong> ${new Date(task.start_time).toLocaleString()}</div>
                    ${task.end_time ? `<div><strong>Ended:</strong> ${new Date(task.end_time).toLocaleString()}</div>` : ''}
                    ${task.result ? `<div><strong>Result:</strong> ${JSON.stringify(task.result).substring(0, 100)}...</div>` : ''}
                    ${task.error ? `<div><strong>Error:</strong> ${task.error}</div>` : ''}
                `;
                tasksList.appendChild(taskDiv);
            });
        }
        
        function populateToolSelect() {
            const toolSelect = document.getElementById('tool-select');
            toolSelect.innerHTML = '<option value="">Choose a tool...</option>';
            
            for (const [name, tool] of Object.entries(tools)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = `${tool.name} ${tool.is_realtime ? '(Real-time)' : ''}`;
                toolSelect.appendChild(option);
            }
        }
        
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('log-container');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff6b6b' : '#00ff00';
            
            logEntry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> ${message}`;
            logEntry.style.color = color;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('log-container').innerHTML = '';
        }
        
        // Auto-refresh tasks every 5 seconds
        setInterval(refreshTasks, 5000);
        
        // Initialize on page load
        window.onload = function() {
            addLog('Agent Execution System initialized');
        };
    </script>
</body>
</html>
